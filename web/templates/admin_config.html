<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 설정 - Eye Project</title>
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                var theme = (savedTheme === 'dark' || savedTheme === 'light') ? savedTheme : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --border: #d2d2d7;
            --muted: #64748b;
        }

        [data-theme="dark"] {
            --primary: #4ea1ff;
            --bg: #0f1115;
            --card: #161a22;
            --text: #e5e7eb;
            --border: #2a3240;
            --muted: #aab3c2;
        }

        .theme-toggle-floating {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 999px;
            min-height: 44px;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(15,23,42,0.16);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
        }

        .theme-toggle-floating:hover { transform: translateX(-50%) translateY(-1px); }
        .theme-toggle-floating:active { transform: translateX(-50%) scale(0.98); }

        .confirm-toast {
            position: fixed;
            left: 50%;
            top: 24px;
            transform: translateX(-50%);
            width: min(92vw, 520px);
            background: #1f2937;
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 26px rgba(0,0,0,0.28);
            padding: 14px;
            z-index: 4000;
            display: none;
        }

        .confirm-toast.show { display: block; }

        .confirm-toast-message {
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .confirm-toast-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .toast-btn {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        .toast-btn-cancel {
            background: #64748b;
            color: #fff;
        }

        .toast-btn-confirm {
            background: #ef4444;
            color: #fff;
        }

        [data-theme="dark"] .field {
            background: #111827;
        }

        [data-theme="dark"] .field label {
            color: #cbd5e1;
        }

        [data-theme="dark"] .field input,
        [data-theme="dark"] .field select {
            background: #0f172a;
            color: var(--text);
        }

        [data-theme="dark"] .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            width: 1280px;
            height: 800px;
            overflow: hidden;
            box-sizing: border-box;
            padding: 24px;
        }

        .layout {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .desc {
            color: var(--muted);
            font-size: 0.92rem;
            margin-top: 6px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            overflow: auto;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .section-title {
            margin: 16px 0 10px 0;
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .llm-note {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .field {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
        }

        .field-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .key-chip {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--primary);
            background: rgba(0, 122, 255, 0.08);
            border: 1px solid rgba(0, 122, 255, 0.18);
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .field-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 8px;
        }

        .field-hint {
            font-size: 0.77rem;
            color: #475569;
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        [data-theme="dark"] .field-hint {
            background: #0f172a;
            color: #cbd5e1;
        }

        .field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #334155;
        }

        .field input,
        .field select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-warning {
            background: #f59e0b;
            color: #fff;
        }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }

        .status {
            font-size: 0.88rem;
            color: var(--muted);
            margin-right: auto;
            align-self: center;
        }

        .ai-control-panel {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
        }

        .ai-status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .ai-status-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 9px;
            font-size: 0.82rem;
        }

        [data-theme="dark"] .ai-status-item { background: #0f172a; }

        .ai-warning { color: #b45309; font-size: 0.82rem; line-height: 1.45; }
        .ai-error { color: #dc2626; }
        .ai-control-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .ai-control-actions .btn:disabled { opacity:0.55; cursor:not-allowed; }

        @media screen and (max-width: 768px) {
            body {
                width: 100%;
                min-height: 100dvh;
                height: auto;
                max-width: 100vw;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 12px;
            }

            .layout {
                height: auto;
                min-height: calc(100dvh - 24px);
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .card {
                padding: 12px;
            }

            .config-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                min-height: 48px;
            }

            .status {
                margin-right: 0;
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <div class="header">
        <div>
            <h1 data-i18n="admin_config_title">⚙️ 관리자 Config 설정</h1>
            <div class="desc">admin 로그인 상태에서만 접근 가능합니다. 저장 시 일부 항목은 서버 재시작 후 완전 적용됩니다.</div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary" onclick="logoutAdmin()">로그아웃</button>
            <button class="btn btn-secondary" onclick="location.href='/'">메인으로</button>
        </div>
    </div>

    <div class="card">
        <div class="section-title" data-i18n="section_general_settings">일반 시스템 설정</div>
        <div id="config-grid" class="config-grid"></div>

        <div class="section-title" data-i18n="section_llm_settings">LLM/API 키 설정</div>
        <div class="llm-note">API 키는 마스킹되어 표시됩니다. 비워두면 기존 키 유지, 새 값을 입력하면 즉시 갱신됩니다.</div>
        <div id="llm-config-grid" class="config-grid"></div>

        <div class="section-title">로컬 AI 서버 관리</div>
        <div class="llm-note">A의 요청 설정과 Jetson B의 실제 실행 설정은 별도로 관리됩니다. 상태 조회와 초안 저장은 모델을 시작하거나 중지하지 않습니다.</div>
        <div id="ai-control-panel" class="ai-control-panel">
            <div id="ai-control-status" class="ai-warning">기능 상태를 확인하는 중입니다.</div>
            <div id="ai-status-grid" class="ai-status-grid" hidden></div>
            <div id="ai-generation-fields" class="config-grid" hidden>
                <div class="field"><label for="ai-temperature">로컬 채팅 temperature</label><input id="ai-temperature" type="number" min="0" max="1" step="0.05"></div>
                <div class="field"><label for="ai-top-p">로컬 채팅 top_p</label><input id="ai-top-p" type="number" min="0.01" max="1" step="0.05"></div>
                <div class="field"><label for="ai-max-tokens">로컬 채팅 최대 출력 token</label><input id="ai-max-tokens" type="number" min="1" max="4096" step="1"></div>
            </div>
            <div id="ai-runtime-fields" class="config-grid" hidden>
                <div class="field"><label for="ai-profile">B 실행 프로필</label><select id="ai-profile"><option value="stopped">stopped</option><option value="chat_only">chat_only</option><option value="vlm_only">vlm_only</option></select></div>
                <div class="field"><label for="ai-chat-artifact">일반 LLM artifact</label><select id="ai-chat-artifact"></select></div>
                <div class="field"><label for="ai-vlm-artifact">MedGemma artifact</label><select id="ai-vlm-artifact"></select></div>
            </div>
            <div class="ai-control-actions">
                <button class="btn btn-secondary" type="button" onclick="loadAiControl(true)">B 상태 새로고침</button>
                <button id="ai-save-generation" class="btn btn-primary" type="button" onclick="saveGeneration()" disabled>생성 설정 저장</button>
                <button id="ai-save-draft" class="btn btn-secondary" type="button" onclick="saveRuntimeDraft()" disabled>실행 설정 초안 저장</button>
                <button id="ai-plan" class="btn btn-secondary" type="button" onclick="validateRuntimeDraft()" disabled>변경 검증</button>
                <button id="ai-apply" class="btn btn-warning" type="button" onclick="applyRuntimePlan()" disabled>실제 적용 비활성</button>
            </div>
            <div id="ai-plan-result" class="ai-warning" aria-live="polite"></div>
        </div>
    </div>

    <div class="actions">
        <div id="status" class="status" data-i18n="status_loading_config">설정을 불러오는 중...</div>
        <button class="btn btn-warning" onclick="requestServerControl('restart')">서버 재시작</button>
        <button class="btn btn-danger" onclick="requestServerControl('shutdown')">서버 종료</button>
        <button class="btn btn-secondary" onclick="loadConfig()">새로고침</button>
        <button class="btn btn-primary" onclick="saveConfig()">저장</button>
    </div>
</div>

<div id="confirm-toast" class="confirm-toast" role="dialog" aria-modal="true" aria-live="assertive">
    <div id="confirm-toast-message" class="confirm-toast-message"></div>
    <div class="confirm-toast-actions">
        <button id="confirm-toast-cancel" class="toast-btn toast-btn-cancel">취소</button>
        <button id="confirm-toast-ok" class="toast-btn toast-btn-confirm">확인</button>
    </div>
</div>

<script>
    const configState = { values: {}, keys: [], llmSettings: {}, aiControl: {} };
    const aiControlState = { overview: null, generation: null, draft: null, plan: null, poller: null, operationPoller: null, operationId: null };
    let adminCsrfToken = '';
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (character) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[character]);
    }
    const CONFIG_HELP = {
        SERVER_IP: {
            title: '서버 바인딩 IP',
            description: 'Flask 서버가 수신 대기할 네트워크 주소입니다.',
            hint: '일반적으로 0.0.0.0(외부 접속 허용) 사용. 로컬 전용은 127.0.0.1.'
        },
        SERVER_PORT: {
            title: '서버 포트',
            description: '웹 UI 접속 포트 번호입니다.',
            hint: '기본 5000. 방화벽/프록시 환경에 맞춰 변경 (1~65535).'
        },
        DEBUG_MODE: {
            title: '디버그 모드',
            description: '오류 상세 로그 및 자동 리로드 사용 여부입니다.',
            hint: '개발 중에만 True 권장. 운영/배포는 False 권장.'
        },
        CAMERA_DEVICE_INDEX: {
            title: '일반 웹캠 장치 번호',
            description: '안구 및 피부 검사에 사용할 OpenCV 카메라 인덱스입니다.',
            hint: 'Logitech 등 일반 웹캠의 /dev/videoN 번호에서 N을 입력하세요.'
        },
        MICROSCOPE_CAMERA_DEVICE_INDEX: {
            title: '두피 현미경 카메라 장치 번호',
            description: '두피 검사에 사용할 USB 현미경 카메라 인덱스입니다.',
            hint: 'DASO USB 현미경의 /dev/videoN 번호에서 N을 입력하세요.'
        },
        MEDIAPIPE_CONF_THRESHOLD: {
            title: 'MediaPipe 검출 임계값(분석)',
            description: '분석 파이프라인에서 눈을 검출할 최소 신뢰도입니다.',
            hint: '값↑: 오검출 감소/미검출 증가, 값↓: 검출 증가/잡음 증가. 보통 0.4~0.6.'
        },
        MEDIAPIPE_IOU_THRESHOLD: {
            title: 'MediaPipe NMS IoU 임계값',
            description: '중복 박스 제거 기준(IoU)입니다.',
            hint: '일반적으로 0.4~0.6. 너무 낮으면 박스가 과도하게 제거될 수 있음.'
        },
        MEDIAPIPE_STATUS_CONF_THRESHOLD: {
            title: '상태 표시용 임계값',
            description: '실시간 감지 상태(/detect_status) 판정용 최소 신뢰도입니다.',
            hint: '자동셔터 체감에 영향. 너무 높으면 감지 점등이 잘 안됨.'
        },
        MEDIAPIPE_INPUT_SIZE: {
            title: 'MediaPipe 입력 해상도',
            description: '검출 모델 입력 크기(px)입니다.',
            hint: '값↑: 정확도 향상 가능/속도 저하, 값↓: 속도 향상/정밀도 저하. 보통 640.'
        },
        CLASSIFIER_CONFIDENCE_THRESHOLD: {
            title: '분류 신뢰도 임계값',
            description: '질환 분류 결과를 신뢰할 최소 확률 기준입니다.',
            hint: '값↑: 보수적 판정, 값↓: 민감한 판정. 보통 0.6~0.8 권장.'
        },
        IRIS_REMOVAL_ENABLED: {
            title: '홍채 제거 사용 여부',
            description: '충혈도 계산 전 홍채 영역 제외 처리 활성화입니다.',
            hint: 'True 권장. 특정 환경에서 오히려 불안정하면 False로 비교 테스트.'
        },
        IRIS_THRESHOLD: {
            title: '홍채 제거 임계값',
            description: '홍채 분리 민감도를 조절합니다.',
            hint: '값↑: 더 엄격하게 제거, 값↓: 완화. 과도 조정 시 공막 정보 손실 가능.'
        },
        AUTO_DIST_THRESHOLD: {
            title: '자동촬영 중심 거리 허용치',
            description: '가이드 중심과 눈 중심 간 허용 거리(px)입니다.',
            hint: '값↓: 정렬 엄격(촬영 어려움), 값↑: 정렬 완화(오정렬 촬영 가능).'
        },
        AUTO_SCALE_MIN: {
            title: '자동촬영 최소 크기 비율',
            description: '눈 크기가 가이드 대비 이 값 이상일 때만 통과합니다.',
            hint: '값↑: 더 가까이 맞춰야 함. 보통 0.75~0.9 범위에서 조정.'
        },
        AUTO_SCALE_MAX: {
            title: '자동촬영 최대 크기 비율',
            description: '눈 크기가 가이드 대비 이 값 이하일 때만 통과합니다.',
            hint: '값↓: 너무 가까운 촬영 방지. 보통 1.0~1.2 범위에서 조정.'
        },
        AUTO_CAPTURE_HOLD_FRAMES: {
            title: '자동촬영 유지 프레임',
            description: '조건을 연속으로 만족해야 하는 프레임 수입니다.',
            hint: '값↑: 흔들림에 강함/반응 느림, 값↓: 반응 빠름/오촬영 가능성 증가.'
        }
    };

    const LLM_HELP = {
        LLM_PROVIDER: {
            title: 'LLM 제공자',
            description: '채팅 API(/api/chat)에서 사용할 LLM 벤더를 선택합니다.',
            hint: 'openai, gemini, local 중 하나를 명시적으로 선택합니다.'
        },
        OPENAI_MODEL: {
            title: 'OpenAI 모델',
            description: 'OpenAI 제공자 선택 시 사용할 모델명입니다.',
            hint: '예: gpt-4o-mini, gpt-4.1-mini'
        },
        GEMINI_MODEL: {
            title: 'Gemini 모델',
            description: 'Gemini 제공자 선택 시 사용할 모델명입니다.',
            hint: '예: gemini-2.5-flash, gemini-2.5-pro, gemini-2.0-flash'
        },
        OPENAI_API_KEY: {
            title: 'OpenAI API Key',
            description: 'OpenAI API 인증 키입니다.',
            hint: '새 키를 입력하면 기존 키를 덮어씁니다. 비워두면 기존 키 유지.'
        },
        GEMINI_API_KEY: {
            title: 'Gemini API Key',
            description: 'Google Gemini API 인증 키입니다.',
            hint: '새 키를 입력하면 기존 키를 덮어씁니다. 비워두면 기존 키 유지.'
        },
        LOCAL_LLM_BASE_URL: {
            title: '로컬 LLM Base URL',
            description: 'Jetson B의 OpenAI 호환 /v1 주소입니다.',
            hint: '예: http://<Jetson-B-IP>:8080/v1. 허용 목록에도 동일 origin을 등록하세요.'
        },
        LOCAL_LLM_MODEL: {

    function getAdminCsrfToken() {
        if (adminCsrfToken) return adminCsrfToken;
        try {
            const token = sessionStorage.getItem('admin_csrf_token') || '';
            if (token) {
                adminCsrfToken = token;
                return token;
            }
        } catch (e) {}
        return '';
    }

    function buildAdminHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = getAdminCsrfToken();
        if (token) {

        }
        return headers;
    }

    function setAiText(id, value, isError = false) {
        const element = document.getElementById(id);
        if (!element) return;
        element.textContent = String(value == null ? '—' : value);
        element.classList.toggle('ai-error', !!isError);
    }

    function statusItem(label, value) {
        const item = document.createElement('div');
        item.className = 'ai-status-item';
        const title = document.createElement('strong');
        title.textContent = label + ': ';
        const text = document.createElement('span');
        text.textContent = value == null ? '— / 측정 불가' : String(value);
        item.append(title, text);
        return item;
    }

    function renderAiOverview(payload) {
        const grid = document.getElementById('ai-status-grid');
        grid.replaceChildren();
        const overview = payload.overview || {};
        const state = overview.state || {};
        const engine = state.engine || {};
        const placements = engine.placements || {};
        const telemetry = state.telemetry || {};
        const stateCache = state.cache || {};
        const stale = !!stateCache.stale;
        const unreachable = stateCache.connection_state === 'unreachable';
        grid.append(
            statusItem('관리 연결', unreachable ? 'unreachable' : (stale ? 'stale' : 'connected')),
            statusItem('관찰 시각', state.observed_at),
            statusItem('실제 프로필', state.observed_profile || state.applied_profile),
            statusItem('lifecycle', state.lifecycle_state),
            statusItem('artifact', engine.artifact_id),
            statusItem('프로세스', engine.process_running),
            statusItem('모델 상주', engine.model_loaded),
            statusItem('추론 준비', engine.inference_ready),
            statusItem('배치', placements.vision ? `텍스트 ${placements.text || '—'} / 비전 ${placements.vision}` : placements.text),
            statusItem('메모리 MiB', telemetry.memory_used_mib),
            statusItem('온도 °C', telemetry.temperature_celsius),
            statusItem('GPU 활동률', telemetry.gpu_activity_percent)
        );
        grid.hidden = false;

        const models = ((overview.models || {}).models || []);
        for (const [kind, selectId] of [['chat', 'ai-chat-artifact'], ['vlm', 'ai-vlm-artifact']]) {
            const select = document.getElementById(selectId);
            if (!select.options.length) {
                models.filter((item) => item.engine_kind === kind).forEach((item) => {
                    const option = document.createElement('option');
                    option.value = item.artifact_id;
                    option.textContent = `${item.display_name} · ${item.quantization}${item.medical_validated ? '' : ' · 의료 품질 미평가'}`;
                    option.disabled = !item.eligible_for_activation;
                    select.append(option);
                });
            }
        }
        document.getElementById('ai-runtime-fields').hidden = false;
        document.getElementById('ai-save-draft').disabled = !configState.aiControl.drafts_enabled;
        updateRuntimeApplyButton();
        const stateMessage = unreachable
            ? '관리 서비스에 연결할 수 없어 마지막 snapshot을 표시합니다. 모델 서비스 상태는 별도 확인이 필요합니다.'
            : (stale ? '오래된 상태입니다. 변경 검증을 진행하지 마세요.' : 'Jetson B 읽기 전용 상태를 확인했습니다.');
        setAiText('ai-control-status', stateMessage, stale || unreachable);
    }

    async function loadGeneration() {
        const response = await fetch('/api/admin/ai-control/generation');
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error(data.message || '생성 설정 조회 실패');
        aiControlState.generation = data.generation;
        document.getElementById('ai-temperature').value = data.generation.temperature == null ? '' : data.generation.temperature;
        document.getElementById('ai-top-p').value = data.generation.top_p == null ? '' : data.generation.top_p;
        document.getElementById('ai-max-tokens').value = data.generation.max_tokens;
        document.getElementById('ai-temperature').placeholder = '저장 전 runtime 기본값';
        document.getElementById('ai-top-p').placeholder = '저장 전 runtime 기본값';
        document.getElementById('ai-generation-fields').hidden = false;
        document.getElementById('ai-save-generation').disabled = false;
    }

    async function loadAiControl(force = false) {
        try {
            await loadGeneration();
            if (!configState.aiControl.enabled) {
                aiControlState.overview = null;
                updateRuntimeApplyButton();
                setAiText('ai-control-status', '원격 관리 기능이 꺼져 있습니다. 기존 채팅·검사 동작은 유지됩니다.');
                return;
            }
            const node = encodeURIComponent(configState.aiControl.node_id);
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/overview${force ? '?refresh=1' : ''}`);
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || 'B 상태 조회 실패');
            aiControlState.overview = data.overview;
            renderAiOverview(data);
        } catch (error) {
            aiControlState.overview = null;
            updateRuntimeApplyButton();
            setAiText('ai-control-status', `관리 상태 조회 실패: ${error.message || error}. 기존 검사와 채팅 설정은 별도로 유지됩니다.`, true);
        }
    }

    async function saveGeneration() {
        const temperatureRaw = document.getElementById('ai-temperature').value;
        const topPRaw = document.getElementById('ai-top-p').value;
        const maxTokensRaw = document.getElementById('ai-max-tokens').value;
        const temperature = Number(temperatureRaw);
        const topP = Number(topPRaw);
        const maxTokens = Number(maxTokensRaw);
        if (!temperatureRaw || !topPRaw || !maxTokensRaw || !Number.isFinite(temperature)
                || !Number.isFinite(topP) || !Number.isInteger(maxTokens)) {
            await showAlert('temperature, top_p, 최대 token을 모두 유효한 숫자로 입력해 주세요.');
            return;
        }
        try {
            const response = await fetch('/api/admin/ai-control/generation', {
                method: 'POST', headers: buildAdminHeaders(), body: JSON.stringify({
                    expected_revision: aiControlState.generation.generation_revision,
                    settings: { temperature, top_p: topP, max_tokens: maxTokens }
                })
            });
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '저장 실패');
            aiControlState.generation = data.generation;
            await showAlert(data.message);
        } catch (error) {
            await showAlert(`생성 설정 저장 실패: ${error.message || error}`);
        }
    }

    function selectedRuntimeConfig() {
        const models = ((aiControlState.overview || {}).models || {}).models || [];
        const selectConfig = (kind, id) => {
            const artifactId = document.getElementById(id).value;
            const artifact = models.find((item) => item.engine_kind === kind && item.artifact_id === artifactId);
            if (!artifact || !artifact.presets || !artifact.presets.length) throw new Error(`${kind} preset이 없습니다.`);
            return { artifact_id: artifactId, preset_id: artifact.presets[0].preset_id, runtime_overrides: {} };
        };
        return {
            active_profile: document.getElementById('ai-profile').value,
            engines: { chat: selectConfig('chat', 'ai-chat-artifact'), vlm: selectConfig('vlm', 'ai-vlm-artifact') }
        };
    }

    async function saveRuntimeDraft() {
        try {
            aiControlState.plan = null;
            updateRuntimeApplyButton();
            const current = aiControlState.overview.current_config;
            const node = encodeURIComponent(configState.aiControl.node_id);
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/drafts`, {
                method: 'POST', headers: buildAdminHeaders(), body: JSON.stringify({
                    schema_version: '1.0', expected_config_revision: current.config_revision,
                    desired: selectedRuntimeConfig()
                })
            });
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '초안 저장 실패');
            aiControlState.draft = data.draft;
            document.getElementById('ai-plan').disabled = false;
            setAiText('ai-plan-result', '초안이 저장되었습니다. 현재 모델에는 적용되지 않았습니다.');
        } catch (error) {
            setAiText('ai-plan-result', `초안 저장 실패: ${error.message || error}`, true);
        }
    }

    async function validateRuntimeDraft() {
        if (!aiControlState.draft) return;
        try {
            const current = aiControlState.overview.current_config;
            const node = encodeURIComponent(configState.aiControl.node_id);
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/plans`, {
                method: 'POST', headers: buildAdminHeaders(), body: JSON.stringify({
                    action: 'apply_config', draft_id: aiControlState.draft.draft_id,
                    expected_config_revision: current.config_revision,
                    expected_deployment_generation: current.deployment_generation,
                    drain_policy: 'wait_then_abort', drain_timeout_seconds: 120
                })
            });
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '검증 실패');
            aiControlState.plan = data.plan;
            const blockers = data.plan.blocking_reasons || [];
            updateRuntimeApplyButton();
            setAiText('ai-plan-result', blockers.length
                ? `검증 완료. 실제 적용 차단 사유: ${blockers.join(', ')}`
                : `검증 완료. 재시작 필요: ${data.plan.restart_required}`);
        } catch (error) {
            aiControlState.plan = null;
            updateRuntimeApplyButton();
            setAiText('ai-plan-result', `변경 검증 실패: ${error.message || error}`, true);
        }
    }

    function updateRuntimeApplyButton() {
        const button = document.getElementById('ai-apply');
        const overview = aiControlState.overview || {};
        const state = overview.state || {};
        const current = overview.current_config || {};
        const capabilities = overview.capabilities || {};
        const activity = state.activity || {};
        const plan = aiControlState.plan;
        const connected = ['state', 'capabilities', 'current_config'].every((name) => {
            const cache = (overview[name] || {}).cache || {};
            return cache.connection_state === 'connected' && !cache.stale;
        });
        const ready = !!(configState.aiControl.enabled && configState.aiControl.drafts_enabled
            && configState.aiControl.mutations_enabled && configState.aiControl.research_guard_ready
            && capabilities.drafts_enabled
            && capabilities.mutations_enabled && capabilities.managed_ingress_verified
            && connected && plan && !(plan.blocking_reasons || []).length
            && Date.parse(plan.expires_at) > Date.now()
            && plan.expected_config_revision === current.config_revision
            && plan.expected_deployment_generation === current.deployment_generation
            && state.active_operation_id == null && activity.source === 'managed_ingress'
            && activity.admission === 'open' && activity.inflight === 0
            && activity.unknown_inflight === 0 && !aiControlState.operationId);
        button.disabled = !ready;
        button.textContent = ready ? '실제 적용' : '실제 적용 비활성';
    }

    async function refreshRuntimeOperation() {
        if (!aiControlState.operationId) return;
        const node = encodeURIComponent(configState.aiControl.node_id);
        try {
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/operations/${aiControlState.operationId}`);
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '작업 상태 조회 실패');
            const operation = data.operation;
            setAiText('ai-plan-result', `작업 ${operation.state || 'unknown'} · 단계 ${operation.stage || 'unknown'}`,
                operation.state === 'rolled_back' || operation.state === 'manual_intervention_required');
            if (operation.completed) {
                clearInterval(aiControlState.operationPoller);
                aiControlState.operationPoller = null;
                aiControlState.operationId = null;
                aiControlState.plan = null;
                await loadAiControl(true);
            }
        } catch (error) {
            setAiText('ai-plan-result', '작업 결과를 확인할 수 없습니다. 새 적용을 시작하지 말고 상태를 다시 확인하세요.', true);
        }
        updateRuntimeApplyButton();
    }

    function trackRuntimeOperation(operationId) {
        if (!/^[0-9a-f]{32}$/.test(operationId)) return;
        aiControlState.operationId = operationId;
        if (aiControlState.operationPoller) clearInterval(aiControlState.operationPoller);
        aiControlState.operationPoller = setInterval(refreshRuntimeOperation, 2000);
        updateRuntimeApplyButton();
        refreshRuntimeOperation();
    }

    async function loadLatestRuntimeOperation() {
        const node = encodeURIComponent(configState.aiControl.node_id);
        try {
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/operations/latest`);
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '작업 기록 조회 실패');
            if (data.submission && data.submission.submission_unknown) {
                setAiText('ai-plan-result', '이전 적용 요청의 접수 여부를 확인할 수 없습니다. 자동 재시도하지 않습니다.', true);
            } else if (data.submission && data.submission.submission_rejected) {
                setAiText('ai-plan-result', '마지막 적용 요청은 거절됐습니다. 새 계획을 검증해야 합니다.', true);
            } else if (data.submission && data.submission.operation_id && data.operation && !data.operation.completed) {
                trackRuntimeOperation(data.submission.operation_id);
            } else if (data.operation) {
                setAiText('ai-plan-result', `마지막 작업: ${data.operation.state || 'unknown'}`,
                    data.operation.state === 'rolled_back' || data.operation.state === 'manual_intervention_required');
            }
        } catch (error) {
            setAiText('ai-plan-result', '관리 작업 기록을 확인할 수 없습니다.', true);
        }
    }

    async function applyRuntimePlan() {
        updateRuntimeApplyButton();
        if (document.getElementById('ai-apply').disabled) return;
        const plan = aiControlState.plan;
        const change = (plan.changes || [])[0] || {};
        const before = (change.before || {}).active_profile || aiControlState.overview.current_config.applied_profile;
        const after = (change.after || {}).active_profile || before;
        const confirmation = `대상: ${configState.aiControl.node_id}\n변경: ${before} → ${after}\n계획 만료: ${plan.expires_at}\n확인 항목: ${(plan.required_acknowledgements || []).join(', ') || '없음'}\n진행 중 요청이 있으면 완료를 기다립니다. 실패하면 이전 상태로 복구를 시도합니다.`;
        if (!await showConfirm(confirmation, '실제 적용')) return;
        document.getElementById('ai-apply').disabled = true;
        const node = encodeURIComponent(configState.aiControl.node_id);
        try {
            const response = await fetch(`/api/admin/ai-control/nodes/${node}/operations`, {
                method: 'POST', headers: buildAdminHeaders(), body: JSON.stringify({
                    plan_id: plan.plan_id, plan_digest: plan.plan_digest,
                    expected_config_revision: plan.expected_config_revision,
                    expected_deployment_generation: plan.expected_deployment_generation,
                    acknowledgements: plan.required_acknowledgements || []
                })
            });
            const data = await response.json();
            if (!response.ok || data.status !== 'ok') throw new Error(data.message || '작업 접수 확인 실패');
            setAiText('ai-plan-result', '작업이 접수됐습니다. 실제 적용 상태를 확인하는 중입니다.');
            trackRuntimeOperation(data.operation.operation_id);
        } catch (error) {
            aiControlState.plan = null;
            setAiText('ai-plan-result', `적용 접수 결과를 확인할 수 없습니다: ${error.message || error}. 자동 재시도하지 않습니다.`, true);
        }
        updateRuntimeApplyButton();
    }

    async function loadConfig() {
        try {
            setStatus('설정을 불러오는 중...');
            const res = await fetch('/api/admin/config');
            const data = await res.json();

            if (!res.ok || data.status !== 'ok') {
                throw new Error(data.message || '설정 조회 실패');
            }

            configState.values = data.config || {};
            configState.keys = data.editable_keys || Object.keys(configState.values);
            configState.llmSettings = data.llm_settings || {};
            configState.aiControl = data.ai_control || {};
            adminCsrfToken = String(data.csrf_token || '').trim();
            if (adminCsrfToken) {
                try { sessionStorage.setItem('admin_csrf_token', adminCsrfToken); } catch (e) {}
            }
            renderConfigFields();
            renderLLMFields();
            await loadAiControl(false);
            if (configState.aiControl.enabled && configState.aiControl.mutations_enabled) {
                await loadLatestRuntimeOperation();
            }
            if (aiControlState.poller) clearInterval(aiControlState.poller);
            if (configState.aiControl.enabled) {
                aiControlState.poller = setInterval(() => loadAiControl(false), 5000);
            }
            setStatus('설정 로드 완료');
        } catch (error) {
            setStatus(`조회 실패: ${error.message || error}`, true);
        }
    }

    function collectUpdates() {
        const updates = {};
        document.querySelectorAll('[data-key]').forEach((el) => {
            const key = el.dataset.key;
            const original = configState.values[key];

            let next = el.value;
            if (typeof original === 'boolean') {
                next = String(next).toLowerCase() === 'true';
            }

            updates[key] = next;
        });
        return updates;
    }

    function collectLlmUpdates() {
        const llmUpdates = {};
        document.querySelectorAll('[data-llm-key]').forEach((el) => {
            const key = el.dataset.llmKey;
            if (key.endsWith('_DELETE')) {
                if (el.checked) llmUpdates[key] = true;
                return;
            }
            let value = String(el.value || '').trim();

            if (key === 'LLM_PROVIDER') {
                value = value.toLowerCase();
            }

            // API 키는 빈 입력이면 기존 유지
            if ((key === 'OPENAI_API_KEY' || key === 'GEMINI_API_KEY' || key === 'LOCAL_LLM_API_KEY') && value === '') {
                return;
            }

            llmUpdates[key] = value;
        });
        return llmUpdates;
    }

    function showToastPopup(message, options = {}) {
        return new Promise((resolve) => {
            const toast = document.getElementById('confirm-toast');
            const msgEl = document.getElementById('confirm-toast-message');
            const okBtn = document.getElementById('confirm-toast-ok');
            const cancelBtn = document.getElementById('confirm-toast-cancel');

            if (!toast || !msgEl || !okBtn || !cancelBtn) {
                if (options.hideCancel) {
                    window.alert(message);
                    resolve(true);
                } else {
                    resolve(window.confirm(message));
                }
                return;
            }

            const confirmText = options.confirmText || '확인';
            const cancelText = options.cancelText || '취소';
            const hideCancel = !!options.hideCancel;

            msgEl.textContent = message;
            okBtn.textContent = confirmText;
            cancelBtn.textContent = cancelText;
            cancelBtn.style.display = hideCancel ? 'none' : 'inline-block';

            toast.classList.add('show');
            if (!hideCancel) cancelBtn.focus();

            const cleanup = (result) => {
                toast.classList.remove('show');
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                resolve(result);
            };

            okBtn.onclick = () => cleanup(true);
            cancelBtn.onclick = () => cleanup(false);
        });
    }

    async function showAlert(message) {
        await showToastPopup(message, { hideCancel: true, confirmText: '확인' });
    }

    async function showConfirm(message, confirmText = '확인') {
        return showToastPopup(message, { hideCancel: false, confirmText, cancelText: '취소' });
    }

    async function saveConfig() {
        try {
            const updates = collectUpdates();
            const llmUpdates = collectLlmUpdates();
            setStatus('설정 저장 중...');

            const res = await fetch('/api/admin/config', {
                method: 'POST',
                headers: buildAdminHeaders(),
                body: JSON.stringify({ updates, llm_updates: llmUpdates })
            });
            const data = await res.json();

            if (!res.ok || data.status !== 'ok') {
                throw new Error(data.message || '설정 저장 실패');
            }

            setStatus(data.message || '저장 완료');
            await loadConfig();
        } catch (error) {
            setStatus(`저장 실패: ${error.message || error}`, true);
        }
    }

    async function requestServerControl(action) {
        const isRestart = action === 'restart';
        const endpoint = isRestart ? '/api/admin/server/restart' : '/api/admin/server/shutdown';
        const label = isRestart ? '재시작' : '종료';
        const confirmText = isRestart
            ? '서버를 재시작하시겠습니까?\n약 3~10초 동안 접속이 끊길 수 있습니다.'
            : '서버를 종료하시겠습니까?\n종료 후에는 수동으로 다시 실행해야 합니다.';

        const ok = await showConfirm(confirmText, label);
        if (!ok) {
            return;
        }

        try {
            setStatus(`서버 ${label} 요청 중...`);
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: buildAdminHeaders()
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || data.status !== 'ok') {
                throw new Error(data.message || `서버 ${label} 요청 실패`);
            }

            setStatus(data.message || `서버 ${label} 요청 완료`);
            await showAlert(data.message || `서버 ${label} 요청이 처리되었습니다.`);
        } catch (error) {
            setStatus(`서버 ${label} 실패: ${error.message || error}`, true);
            await showAlert(`서버 ${label} 실패: ${error.message || error}`);
        }
    }

    async function logoutAdmin() {
        const ok = await showConfirm('관리자 세션을 로그아웃하시겠습니까?', '로그아웃');
        if (!ok) return;

        try {
            const res = await fetch('/api/admin/logout', {
                method: 'POST',
                headers: buildAdminHeaders(),
                body: JSON.stringify({})
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || data.status !== 'ok') {
                throw new Error(data.message || '로그아웃 실패');
            }

            try {
                sessionStorage.removeItem('admin_csrf_token');
                sessionStorage.removeItem('user_role');
                sessionStorage.removeItem('user_id');
            } catch (e) {}
            location.href = '/login';
        } catch (error) {
            await showAlert(`로그아웃 실패: ${error.message || error}`);
        }
    }

    window.onload = () => {
        loadConfig();
    };
</script>

<script>
    (function () {
        const root = document.documentElement;
        function currentTheme() {
            const t = root.getAttribute('data-theme');
            return (t === 'dark' || t === 'light') ? t : 'light';
        }
        function themeModeText(mode) {
            let lang = 'ko';
            try {
                const saved = localStorage.getItem('i18n_language') || localStorage.getItem('selectedLanguage') || document.documentElement.lang || 'ko';
                lang = String(saved).slice(0, 2).toLowerCase();
            } catch (e) {}
            const map = {
                ko: { dark: '다크 모드', light: '라이트 모드' },
                en: { dark: 'Dark Mode', light: 'Light Mode' },
                zh: { dark: '暗黑模式', light: '浅色模式' },
                vi: { dark: 'Chế độ Tối', light: 'Chế độ Sáng' },
                ru: { dark: 'Темный режим', light: 'Светлый режим' },
                ja: { dark: 'ダークモード', light: 'ライトモード' }
            };
            const selected = map[lang] || map.ko;
            return selected[mode] || map.ko[mode];
        }
        function applyTheme(theme, persist) {
            root.setAttribute('data-theme', theme);
            if (persist) {
                try { localStorage.setItem('theme', theme); } catch (e) {}
            }
            const btn = document.getElementById('global-theme-toggle');
            if (!btn) return;
            const icon = btn.querySelector('[data-role="icon"]');
            const label = btn.querySelector('[data-role="label"]');
            if (theme === 'dark') {
                if (icon) icon.textContent = '☀️';
                if (label) label.textContent = themeModeText('light');
            } else {
                if (icon) icon.textContent = '🌙';
                if (label) label.textContent = themeModeText('dark');
            }
        }
        applyTheme(currentTheme(), false);
    })();
</script>
